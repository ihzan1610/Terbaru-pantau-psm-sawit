name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare offline html2canvas asset
        run: |
          npm install --no-save html2canvas@1.4.1 xlsx@0.18.5
          mkdir -p app/src/main/assets/vendor
          cp node_modules/html2canvas/dist/html2canvas.min.js app/src/main/assets/vendor/html2canvas.min.js
          cp node_modules/xlsx/dist/xlsx.full.min.js app/src/main/assets/vendor/xlsx.full.min.js

      - name: Run source regression tests
        run: node --test tests/*.test.js

      - name: Verify offline assets
        run: |
          test -s app/src/main/assets/vendor/html2canvas.min.js
          test -s app/src/main/assets/vendor/xlsx.full.min.js
          ! grep -Eiq 'https?://[^"'"'"' ]*(cdn|cdnjs|jsdelivr)' app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSM-Sawit-Pantau-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
