
name: Build PSM Pantau v44.3 Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os, subprocess

          cmd = [
              os.environ["SDKMANAGER"],
              "--sdk_root=" + os.environ["ANDROID_HOME"],
              "--licenses"
          ]

          p = subprocess.run(
              cmd,
              input="y\n" * 300,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              timeout=300
          )

          print(p.stdout)

          if p.returncode:
              raise SystemExit(p.returncode)
          PY

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --install "platform-tools"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --install "platforms;android-35"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --install "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify source structure
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "Struktur proyek Capacitor 7 valid"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Verify required packages
        run: |
          node -e "console.log(require.resolve('@capacitor/core'))"
          node -e "console.log(require.resolve('html2canvas'))"
          node -e "console.log(require.resolve('xlsx'))"

      - name: Copy offline vendor libraries
        run: npm run copy:vendor

      - name: Run regression tests
        run: npm test

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PSM-PANTAU-v44.3-DEBUG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
