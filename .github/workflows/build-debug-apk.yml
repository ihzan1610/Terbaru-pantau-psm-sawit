
name: Build PSM Pantau Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Siapkan Android SDK tanpa daftar paket otomatis
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pasang paket satu per satu dengan tanda kutip
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f android/app/build.gradle
          echo "Project files OK"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Verify dependencies
        run: |
          node -e "console.log(require.resolve('html2canvas'))"
          node -e "console.log(require.resolve('xlsx'))"

      - name: Copy vendor assets
        run: npm run copy:vendor

      - name: Run regression tests
        run: npm test

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PSM-PANTAU-DEBUG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
