name: Build PSM Pantau v44.8.5 Cloud and Backup Fixes

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'fix/live-search-filters-v44-4-1', 'fix/v44-8-4-targeted-storage-koperasi', 'fix/v44-8-5-cloud-backup']

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v4 no longer requests the removed legacy SDK package "tools".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Extract ZIP and locate project root
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 3 -type f -name 'PSM-PANTAU-v44.4.0-FIX-ANDROID-IME*.zip' -not -path './.git/*' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "ZIP sumber tidak ditemukan. Upload ZIP source PSM Pantau v44.4.0 ke root repository."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/source"
          ROOT="$(find "$GITHUB_WORKSPACE/source" -type f -name package.json -printf '%h\n' | while read -r d; do
            if [ -f "$d/capacitor.config.json" ] && [ -f "$d/android/app/build.gradle" ] && [ -f "$d/www/index.html" ]; then
              echo "$d"
              break
            fi
          done)"
          if [ -z "$ROOT" ]; then
            echo "Struktur proyek tidak ditemukan di dalam ZIP."
            find "$GITHUB_WORKSPACE/source" -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Apply v44.4.2 live filter and PIN policy fixes
        run: node scripts/apply-live-search-filter-fix.js "$PROJECT_ROOT"

      - name: Apply v44.4.3 Recap Ongkos fixes
        run: node scripts/apply-recap-ongkos-fix.js "$PROJECT_ROOT"

      - name: Apply v44.7.0 UI refinement
        run: node scripts/apply-ui-refinement.js "$PROJECT_ROOT"

      - name: Apply organized Android storage v44.7.0
        run: node scripts/apply-organized-storage-v447.js "$PROJECT_ROOT"

      - name: Apply v44.8.0 offline cache and dark theme fixes
        run: node scripts/apply-cache-theme-v448.js "$PROJECT_ROOT"

      - name: Apply v44.8.4 langsir result visibility fix
        run: node scripts/apply-langsir-result-visibility-v4481.js "$PROJECT_ROOT"

      - name: Apply v44.8.4 native gallery image save fix
        run: |
          node scripts/apply-native-gallery-save-v4483.js "$PROJECT_ROOT"
          sed -i 's/44.8.2/44.8.3/g; s/versionCode 52/versionCode 53/g' "$PROJECT_ROOT"/tests/*.test.js
      - name: Apply v44.8.4 targeted bug fixes
        run: node scripts/apply-targeted-fixes-v4484.js "$PROJECT_ROOT"

      - name: Apply v44.8.5 Cloud fingerprint and verified backup fixes
        run: node scripts/apply-v4485-cloud-backup-fix.js "$PROJECT_ROOT"

      - name: Copy workflow and regression tests into project
        run: |
          mkdir -p "$PROJECT_ROOT/.github/workflows"
          cp "$GITHUB_WORKSPACE/.github/workflows/build-debug-apk.yml" "$PROJECT_ROOT/.github/workflows/build-debug-apk.yml"
          cp "$GITHUB_WORKSPACE/tests/organized-storage-v447.test.js" "$PROJECT_ROOT/tests/"
          cp "$GITHUB_WORKSPACE/tests/v448-offline-theme-regression.test.js" "$PROJECT_ROOT/tests/"
          cp "$GITHUB_WORKSPACE/tests/langsir-result-visibility-v4481.test.js" "$PROJECT_ROOT/tests/"
          cp "$GITHUB_WORKSPACE/tests/v4484-targeted-fixes.test.js" "$PROJECT_ROOT/tests/"
          cp "$GITHUB_WORKSPACE/tests/v4485-cloud-backup.test.js" "$PROJECT_ROOT/tests/"

      - name: Verify v44.8.5 Cloud and backup fixes
        run: |
          set -euo pipefail
          grep -q "fingerprintKebunRows(incoming)" "$PROJECT_ROOT/www/index.html"
          grep -q "public boolean saveTextFile" "$PROJECT_ROOT/android/app/src/main/java/com/psmsawit/pantau/MainActivity.java"
          grep -q "versionName .44.8.5." "$PROJECT_ROOT/android/app/build.gradle"

      - name: Verify organized storage patch
        run: |
          set -euo pipefail
          MAIN="$PROJECT_ROOT/android/app/src/main/java/com/psmsawit/pantau/MainActivity.java"
          WEB="$PROJECT_ROOT/www/index.html"
          ASSET="$PROJECT_ROOT/android/app/src/main/assets/index.html"
          echo "Checking storage marker in $MAIN"
          grep -n 'PSM_ORGANIZED_STORAGE_V447' "$MAIN"
          echo "Checking download router in $WEB"
          grep -n 'PSM_ORGANIZED_DOWNLOAD_ROUTER_V447' "$WEB"
          echo "Checking target folder in native storage code"
          grep -n 'Database APK Pantau PSM Sawit' "$MAIN"
          echo "Checking WebView asset synchronization"
          cmp "$WEB" "$ASSET" || { echo "www/index.html and Android asset differ"; diff -u "$WEB" "$ASSET" | head -n 80; exit 1; }

      - name: Verify project files
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          for f in package.json capacitor.config.json www/index.html android/settings.gradle android/app/build.gradle; do
            test -f "$f" || { echo "File sumber hilang: $f"; exit 1; }
          done
          test -f android/app/src/main/java/com/psmsawit/pantau/MainActivity.java
          test -f android/app/src/main/java/com/psmsawit/pantau/LegacyAndroidBridgePlugin.java

      - name: Install npm dependencies
        run: |
          cd "$PROJECT_ROOT"
          npm install --no-audit --no-fund

      - name: Verify required packages
        run: |
          cd "$PROJECT_ROOT"
          node -e "console.log('Capacitor:', require.resolve('@capacitor/core'))"
          node -e "console.log('html2canvas:', require.resolve('html2canvas'))"
          node -e "console.log('xlsx:', require.resolve('xlsx'))"

      - name: Copy offline vendor libraries
        run: |
          cd "$PROJECT_ROOT"
          npm run copy:vendor

      - name: Verify UI refinement patch
        run: |
          set -euo pipefail
          grep -q 'psm-ui-refinement-v446' "$PROJECT_ROOT/www/index.html"
          grep -q 'PSM_STATUS_BAR_INSETS_V446' "$PROJECT_ROOT/android/app/src/main/java/com/psmsawit/pantau/MainActivity.java"
          cmp "$PROJECT_ROOT/www/index.html" "$PROJECT_ROOT/android/app/src/main/assets/index.html"

      - name: Run regression tests
        run: |
          cd "$PROJECT_ROOT"
          npm test

      - name: Sync Capacitor Android
        run: |
          cd "$PROJECT_ROOT"
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT/android"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Assemble source, workflow, and APK package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release/Source-Patch"
          cp "$PROJECT_ROOT/android/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/release/PSM-PANTAU-v44.8.5.apk"
          cp "$GITHUB_WORKSPACE/PSM-PANTAU-v44.4.0-FIX-ANDROID-IME-WORKFLOW2.zip" "$GITHUB_WORKSPACE/release/Source-Asli-v44.4.0.zip"
          cp "$GITHUB_WORKSPACE/scripts/apply-live-search-filter-fix.js" "$GITHUB_WORKSPACE/release/Source-Patch/"
          cp "$GITHUB_WORKSPACE/scripts/apply-recap-ongkos-fix.js" "$GITHUB_WORKSPACE/release/Source-Patch/"
          cp "$GITHUB_WORKSPACE/scripts/apply-ui-refinement.js" "$GITHUB_WORKSPACE/release/Source-Patch/"
          cp "$GITHUB_WORKSPACE/scripts/apply-organized-storage-v447.js" "$GITHUB_WORKSPACE/release/Source-Patch/"
          cp "$GITHUB_WORKSPACE/scripts/apply-cache-theme-v448.js" "$GITHUB_WORKSPACE/release/Source-Patch/"
          cp "$GITHUB_WORKSPACE/scripts/apply-langsir-result-visibility-v4481.js" "$GITHUB_WORKSPACE/release/Source-Patch/"
          cp "$GITHUB_WORKSPACE/scripts/apply-native-gallery-save-v4483.js" "$GITHUB_WORKSPACE/release/Source-Patch/"
          cp "$GITHUB_WORKSPACE/scripts/apply-targeted-fixes-v4484.js" "$GITHUB_WORKSPACE/release/Source-Patch/"
          cp "$GITHUB_WORKSPACE/scripts/apply-v4485-cloud-backup-fix.js" "$GITHUB_WORKSPACE/release/Source-Patch/"
          cp "$GITHUB_WORKSPACE/.github/workflows/build-debug-apk.yml" "$GITHUB_WORKSPACE/release/build-debug-apk.yml"
          cp "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/release/README.md" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          zip -qr PSM-PANTAU-v44.8.5-PAKET-LENGKAP.zip release

      - name: Upload Complete Release Package
        uses: actions/upload-artifact@v4
        with:
          name: PSM-PANTAU-v44.8.5-PAKET-LENGKAP
          path: PSM-PANTAU-v44.8.4-PAKET-LENGKAP.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PSM-PANTAU-v44.8.5-DEBUG-APK
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

