
name: Build PSM Pantau v44.3 Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan di $ANDROID_HOME"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          p = subprocess.run(
              [os.environ['SDKMANAGER'], '--sdk_root=' + os.environ['ANDROID_HOME'], '--licenses'],
              input='y\n' * 300, text=True, stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT, timeout=300
          )
          print(p.stdout)
          if p.returncode:
              raise SystemExit(p.returncode)
          PY

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source ZIP and locate project root
        id: project
        shell: bash
        run: |
          set -euo pipefail
          find_project() {
            while IFS= read -r -d '' package_file; do
              candidate="$(dirname "$package_file")"
              if [ -f "$candidate/capacitor.config.json" ] && \
                 [ -f "$candidate/www/index.html" ] && \
                 [ -f "$candidate/android/settings.gradle" ] && \
                 [ -f "$candidate/android/app/build.gradle" ]; then
                realpath "$candidate"
                return 0
              fi
            done < <(find . -type f -name package.json -not -path '*/node_modules/*' -not -path '*/.git/*' -print0)
            return 1
          }

          PROJECT_DIR=""
          if PROJECT_DIR="$(find_project)"; then
            echo "Proyek ditemukan langsung: $PROJECT_DIR"
          else
            ZIP_FILE=""
            while IFS= read -r -d '' z; do
              if unzip -l "$z" | grep -Eq '(^|/)capacitor\.config\.json$'; then
                ZIP_FILE="$z"
                break
              fi
            done < <(find . -maxdepth 3 -type f -iname '*.zip' -not -path '*/.git/*' -print0)

            if [ -z "$ZIP_FILE" ]; then
              echo "Tidak ditemukan proyek langsung maupun ZIP sumber yang berisi capacitor.config.json."
              echo "Isi repository:"; find . -maxdepth 4 -type f | sort | head -250
              exit 1
            fi

            echo "Mengekstrak sumber dari: $ZIP_FILE"
            mkdir -p .github-workspace/source
            unzip -q "$ZIP_FILE" -d .github-workspace/source
            cd .github-workspace/source
            PROJECT_DIR="$(find_project)" || {
              echo "ZIP berhasil diekstrak tetapi struktur proyek Android/Capacitor tidak lengkap."
              find . -maxdepth 5 -type f | sort | head -250
              exit 1
            }
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Root proyek: $PROJECT_DIR"

      - name: Install npm dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npm install --no-audit --no-fund

      - name: Verify required packages
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          node -e "console.log('Capacitor:', require.resolve('@capacitor/core'))"
          node -e "console.log('html2canvas:', require.resolve('html2canvas'))"
          node -e "console.log('xlsx:', require.resolve('xlsx'))"

      - name: Copy offline vendor libraries
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npm run copy:vendor

      - name: Run regression tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npm test

      - name: Sync Capacitor Android
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PSM-PANTAU-v44.3-DEBUG-APK
          path: ${{ steps.project.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
