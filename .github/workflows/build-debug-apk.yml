
name: Build Debug APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -iname '*.zip')
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Harus ada tepat satu ZIP di root repository."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/psm-project"
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/psm-project"
          settings_file=$(find "$RUNNER_TEMP/psm-project" -type f -name settings.gradle -print -quit)
          if [ -z "$settings_file" ]; then
            echo "settings.gradle tidak ditemukan."
            exit 1
          fi
          project_dir=$(dirname "$settings_file")
          test -d "$project_dir/app"
          test -f "$project_dir/build.gradle"
          test -f "$project_dir/app/build.gradle"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare offline libraries
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock html2canvas@1.4.1 xlsx@0.18.5
          mkdir -p app/src/main/assets/vendor
          cp node_modules/html2canvas/dist/html2canvas.min.js app/src/main/assets/vendor/html2canvas.min.js
          cp node_modules/xlsx/dist/xlsx.full.min.js app/src/main/assets/vendor/xlsx.full.min.js

      - name: Run regression tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: node --test tests/*.test.js

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSM-Pantau-v42-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
