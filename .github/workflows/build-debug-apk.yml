
name: Build PSM Pantau Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Jangan biarkan action menerima lisensi secara otomatis.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      # Terima lisensi menggunakan input otomatis.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT")
          if not sdk:
              print("ANDROID_HOME / ANDROID_SDK_ROOT tidak ditemukan")
              sys.exit(1)

          candidates = [
              os.path.join(sdk, "cmdline-tools", "latest", "bin", "sdkmanager"),
              os.path.join(sdk, "cmdline-tools", "bin", "sdkmanager"),
              os.path.join(sdk, "tools", "bin", "sdkmanager"),
          ]

          sdkmanager = next((p for p in candidates if os.path.isfile(p)), None)
          if not sdkmanager:
              print("sdkmanager tidak ditemukan")
              sys.exit(1)

          print("SDK:", sdk)
          print("SDK Manager:", sdkmanager)

          result = subprocess.run(
              [sdkmanager, "--sdk_root=" + sdk, "--licenses"],
              input=("y\n" * 300),
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              timeout=300
          )

          print(result.stdout[-12000:])

          if result.returncode != 0:
              print("Penerimaan lisensi gagal")
              sys.exit(result.returncode)

          print("Pemeriksaan penerimaan lisensi selesai")
          PY

      # Pasang Android SDK yang diperlukan.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK packages installed"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f android/app/build.gradle
          echo "Project files OK"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Verify dependencies
        run: |
          node -e "console.log(require.resolve('html2canvas'))"
          node -e "console.log(require.resolve('xlsx'))"

      - name: Copy vendor assets
        run: npm run copy:vendor

      - name: Run regression tests
        run: npm test

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PSM-PANTAU-DEBUG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
