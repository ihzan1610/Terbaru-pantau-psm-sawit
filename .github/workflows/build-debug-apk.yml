name: Build PSM Pantau APK (fixed dependency setup)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify repository root
        run: |
          pwd
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f android/app/build.gradle

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Verify installed vendor packages
        run: |
          node -e "console.log('html2canvas:', require.resolve('html2canvas'))"
          node -e "console.log('xlsx:', require.resolve('xlsx'))"

      - name: Copy offline vendor assets
        run: npm run copy:vendor

      - name: Run regression tests
        run: npm test

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSM-Pantau-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
